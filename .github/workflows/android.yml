name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Icons and splash
        run: npx capacitor-assets generate --android || echo "assets skipped"
      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '0,/<item name="android:background">@null<\/item>/s##<item name="android:background">@null</item><item name="android:windowFullscreen">true</item>#' "$S"
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fizykon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
