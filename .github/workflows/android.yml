name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Icons and splash
        run: npx capacitor-assets generate --android || echo "assets skipped"
      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '0,/<item name="android:background">@null<\/item>/s##<item name="android:background">@null</item><item name="android:windowFullscreen">true</item><item name="android:windowBackground">@android:color/black</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"
      - name: Version from package.json
        run: echo "APP_VER=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV
      - name: Fixed signing key and versionCode
        run: |
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          python3 - <<'PY'
          import re,os
          p='android/app/build.gradle';s=open(p).read()
          ks=os.path.abspath('keystore/debug.keystore')
          blk="android {\n    signingConfigs {\n        debug {\n            storeFile file('"+ks+"')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          s=s.replace("android {\n",blk,1);open(p,'w').write(s)
          PY
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ env.APP_VER }}\"/" android/app/build.gradle
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify signing certificate
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | tee cert.txt
          grep -q "Fizykon Debug" cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fizykon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}-b${{ github.run_number }}
          name: Фізикон ${{ env.APP_VER }} (збірка ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
